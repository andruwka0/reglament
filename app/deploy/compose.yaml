name: reglament
services:
  reglament:
    image: karasik/reglament:${REGLAMENT_COMMIT:?Select an immutable Reglament release}
    user: '1000:1000'
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 192m
    pids_limit: 64
    read_only: true
    tmpfs: ['/tmp:size=8m,mode=1777']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    env_file: [./app.env]
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /var/lib/reglament
      SECURE_COOKIE: '1'
    volumes:
      - type: bind
        source: ./data
        target: /var/lib/reglament
        bind:
          create_host_path: false
    networks: [proxy]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: proxy
      traefik.http.routers.reglament-http.rule: 'Host(`reglament.andruwka.site`)'
      traefik.http.routers.reglament-http.entrypoints: web
      traefik.http.routers.reglament-http.middlewares: https-only@file
      traefik.http.routers.reglament-http.service: reglament
      traefik.http.routers.reglament.rule: 'Host(`reglament.andruwka.site`)'
      traefik.http.routers.reglament.entrypoints: websecure
      traefik.http.routers.reglament.tls.certresolver: letsencrypt
      traefik.http.routers.reglament.service: reglament
      traefik.http.services.reglament.loadbalancer.server.port: '3000'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  proxy:
    external: true
